name: 功能建议
description: 想要一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 README 的「路线图」——AI 能力回归与微信小程序端已经在计划里了。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请先讲场景。了解你面对的问题，比了解你想要的按钮更有用
      placeholder: |
        我在……的时候，遇到了……的麻烦，所以希望能……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 可选。如果你已经想好了怎么做，写在这里
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 可选。包括「为什么现有做法不够用」
  - type: dropdown
    id: scope
    attributes:
      label: 这个建议涉及
      multiple: true
      options:
        - 界面与交互
        - 数据与备份
        - 本地存储
        - 构建与部署
        - 文档
        - 其他
