name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次未跑完的任务，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试与构建
    runs-on: ubuntu-latest

    # 只有 frontend/ 参与构建；legacy/ 是历史存档，不进流水线
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 校验构建产物
        run: |
          # SPA fallback 是部署后按 F5 能不能正常打开的关键，
          # 少了它本地开发完全看不出来，只有线上才会 404。所以在 CI 里卡住。
          for f in dist/index.html dist/404.html dist/_redirects dist/.nojekyll; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少构建产物 $f"
              exit 1
            fi
          done
          echo "构建产物完整"

      - name: 依赖漏洞扫描
        # 不阻塞合并：漏洞披露与修复节奏不受本项目控制，
        # 卡住 PR 只会让人绕过这条检查。有问题会出现在日志里。
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 扫描疑似密钥
        working-directory: .
        run: |
          # 这个项目真的发生过一次：真实的 API Key 被写在源码注释的示例里，
          # 而那个文件不受 .gitignore 保护——一旦提交就会永久留在 git 历史中。
          # 事后删除也无法真正移除，只能作废密钥。所以在这里卡一道。
          matches=$(grep -rInE 'sk-[0-9a-zA-Z]{20,}' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=target \
            . | grep -v 'EXAMPLE' || true)

          if [ -n "$matches" ]; then
            echo "::error::发现疑似 API Key，请确认是否为占位符："
            echo "$matches"
            exit 1
          fi
          echo "未发现疑似密钥"
